<div class="container">

  <h2>
    {{ isEditMode ? 'Edit Product' : 'Add Product' }}
  </h2>

  <form [formGroup]="productForm" (ngSubmit)="saveProduct()">

    <div>
      <label>Product Name</label>

      <input
        type="text"
        formControlName="name"
        placeholder="Enter product name"
      />

      <small *ngIf="productForm.controls.name.touched &&
                    productForm.controls.name.invalid">
        Product name is required.
      </small>
    </div>

    <div>
      <label>Price</label>

      <input
        type="number"
        formControlName="price"
        placeholder="Enter price"
      />

      <small *ngIf="productForm.controls.price.touched &&
                    productForm.controls.price.invalid">
        Enter a valid price.
      </small>
    </div>

    <div>
      <label>Description</label>

      <textarea
        formControlName="description"
        placeholder="Enter description">
      </textarea>

      <small *ngIf="productForm.controls.description.touched &&
                    productForm.controls.description.invalid">
        Description is required.
      </small>
    </div>

    <button type="submit">
      {{ isEditMode ? 'Update' : 'Save' }}
    </button>

    <button type="button" (click)="cancel()">
      Cancel
    </button>

  </form>

</div>
