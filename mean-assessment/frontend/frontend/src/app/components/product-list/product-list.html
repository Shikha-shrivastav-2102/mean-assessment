      <a routerLink="/dashboard" routerLinkActive="active">

<div class="container">

  <div class="header">
    <h2>Product Management</h2>

    <button (click)="addProduct()">
      + Add Product
    </button>
  </div>

  <p *ngIf="loading()">Loading products...</p>

  <p *ngIf="errorMessage()">
    {{ errorMessage() }}
  </p>

  <table *ngIf="!loading() && products().length > 0">

    <thead>
      <tr>
        <th>Product Name</th>
        <th>Price</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let product of products()">

        <td>{{ product.name }}</td>

        <td>{{ product.price | currency:'INR' }}</td>

        <td>{{ product.description }}</td>

        <td>
          <button (click)="editProduct(product._id!)">
            Edit
          </button>

          <button (click)="deleteProduct(product._id!)">
            Delete
          </button>
        </td>

      </tr>

    </tbody>

  </table>

  <p *ngIf="!loading() && products().length === 0">
    No products available.
  </p>

</div>
